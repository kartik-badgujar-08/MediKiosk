version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: medikiosk-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - medikiosk-net

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medikiosk-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - PORT=8000
      - HOST=0.0.0.0
      - MONGODB_URI=mongodb://mongodb:27017/medikiosk
      - DB_NAME=medikiosk
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - FRONTEND_URL=http://localhost:5173
      - ASR_MODE=mock
      - OCR_MODE=mock
      - CLINICAL_NER_MODE=mock
      - LLM_MODE=mock
      - ABDM_MODE=mock
      - HIS_MODE=mock
    depends_on:
      - mongodb
    networks:
      - medikiosk-net

networks:
  medikiosk-net:
    driver: bridge

volumes:
  mongo_data:
