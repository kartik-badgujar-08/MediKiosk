services:
  - type: web
    name: medikiosk-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ASR_MODE
        value: mock
      - key: OCR_MODE
        value: mock
      - key: CLINICAL_NER_MODE
        value: mock
      - key: LLM_MODE
        value: mock
      - key: ABDM_MODE
        value: mock
      - key: HIS_MODE
        value: mock
