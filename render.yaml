services:
  - type: web
    name: medikiosk-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: FRONTEND_URL
        value: "*"
      - key: MONGODB_URI
        value: "none"
      - key: JWT_SECRET
        generateValue: true
      - key: ASR_MODE
        value: mock
      - key: OCR_MODE
        value: mock
      - key: CLINICAL_NER_MODE
        value: mock
      - key: LLM_MODE
        value: auto
      - key: LLM_PROVIDER
        value: engine
      - key: ABDM_MODE
        value: mock
      - key: HIS_MODE
        value: mock
      - key: SIGN_RECOGNITION_MODE
        value: mock
